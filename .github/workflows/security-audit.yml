name: Security audit

# Проверка зависимостей на известные уязвимости (npm audit). Падает, если в
# РАБОЧИХ зависимостях (то, что реально уходит на сервер и в браузер) есть
# уязвимость уровня high или critical. Инструменты разработки (--omit=dev) не
# проверяются: они не попадают в production.
#
# Запускается на каждый push/PR и раз в неделю (новые уязвимости публикуются
# каждый день — код не менялся, а проблема появилась). При падении: обновить
# пакет (npm update <пакет> или npm install <пакет>@<исправленная версия>),
# если исправления нет — overrides в package.json.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # понедельник 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high
